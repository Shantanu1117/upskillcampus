<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="2; url=mega%20project/mega1.html">

    <title>Foodie | Loading...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loader {
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 22px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loading-text {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .dots::after {
            content: "";
            animation: dots 1.5s infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dots {
            0% {
                content: "";
            }

            33% {
                content: ".";
            }

            66% {
                content: "..";
            }

            100% {
                content: "...";
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="logo">Foodie</div>

        <div class="subtitle">
            DELICIOUS FOOD · DELIVERED FAST
        </div>

        <div class="spinner"></div>

        <div class="loading-text">
            Loading<span class="dots"></span>
        </div>

    </div>

    <script>
        setTimeout(function () {
            window.location.href = "mega%20project/mega1.html";
        }, 2000);
    </script>

</body>
</html>
