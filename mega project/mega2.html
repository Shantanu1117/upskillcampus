<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
rel="stylesheet">

<link rel="stylesheet" href="mega2.css">

<title>Foodie Login</title>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">

        <div class="logo">
            <i class="ri-shopping-bag-fill"></i>
            Foodie
        </div>

        <h1>
            Good Food,<br>
            Good <span>Mood</span>
        </h1>

        <p>
            Login to enjoy delicious food
            delivered to your doorstep.
        </p>
<div class="boxer">
        <div class="offer">

            <div class="offer-icon">
                %
            </div>

            <div>
                <h4>Get Fast Delovery</h4>
                <span>Guaranteed!</span>
            </div>

        </div>
     
    </div>
    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="top-icon">
            <i class="ri-shopping-bag-fill"></i>
        </div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to continue to Foodie
        </p>

        <label>Email or Phone Number</label>

        <div class="input-box">

            <i class="ri-user-line"></i>

            <input
            type="text" id="email"
            placeholder="Enter your email or phone">

        </div>

        <label>Password</label>

        <div class="input-box">

            <i class="ri-lock-line"></i>

            <input
            type="password"  id="password"
            placeholder="Enter your password">

            <i class="ri-eye-line eye"></i>

        </div>

        <div class="forgot">
            Forgot Password?
        </div>

        <button class="login"  id="loginBtn">
            Login
        </button>

        <div class="divider">
            or continue with
        </div>

        <div class="socials">

            <div class="social">
                <i class="ri-google-fill"></i>
                Google
            </div>

            <div class="social">
                <i class="ri-apple-fill"></i>
                Apple
            </div>

        </div>

        <div class="signup">

            Don't have an account?

            <span>Sign Up</span>

        </div>

       

    </div>

</div>

<script src="mega2.js"></script>
</body>
</html>
